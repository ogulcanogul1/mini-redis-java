name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # install = verify + copy the jar to the local Maven repo, so bench/ can build against it
      - name: Build, format check, tests, coverage report
        run: mvn -B install
      # Benchmarks are compiled and format-checked in CI, never run there (shared runners are noisy, K13)
      - name: Benchmarks compile
        run: mvn -B -f bench/pom.xml verify
